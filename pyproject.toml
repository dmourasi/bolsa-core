[project]
name = "bolsa-core"
version = "0.1.0"
description = "Shared core for bolsa: funding sources, eligibility evidence, Lattes parsing, OpenAlex and reporting"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "httpx>=0.27",
    "selectolax>=0.3,<1.0",
    "pymupdf>=1.24",
    "pyyaml>=6.0",
    "lxml>=5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bolsa_core"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-httpx>=0.30",
]
